{% extends 'base.html' %}

{% block title %}
Удаление новости
{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-danger text-white">
        <h3>Удаление новости</h3>
    </div>
    <div class="card-body">
        <p>Вы уверены, что хотите удалить новость <strong>"{{ news.title }}"</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{{ news.get_absolute_url }}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
